{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Список героев</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f8;
            margin: 0;
            padding: 30px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .hero-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr); /* ровно 3 в ряду */
            gap: 20px;
            max-width: 1100px;
            margin: 30px auto;
        }
        .hero-card {
            display: block;
            text-decoration: none;
            background: #fff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            color: #2c3e50;
        }
        .hero-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }
        .hero-card__image {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background: #ddd;
            display: block;
        }
        .hero-card__placeholder {
            width: 100%;
            aspect-ratio: 1 / 1;
            background: #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-size: 14px;
        }
        .hero-card__name {
            padding: 12px;
            text-align: center;
            font-weight: bold;
            font-size: 18px;
        }
        .empty {
            text-align: center;
            color: #888;
            grid-column: 1 / -1;
            padding: 40px;
        }
        @media (max-width: 800px) {
            .hero-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 500px) {
            .hero-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <h1>Герои</h1>

    <div class="hero-grid">
        {% for hero in heroes %}
            <a class="hero-card" href="{% url 'heroes:detail' hero.pk %}">
                {% if hero.image %}
                    <img class="hero-card__image"
                         src="{{ hero.image.url }}"
                         alt="{{ hero.name }}">
                {% else %}
                    <div class="hero-card__placeholder">Нет изображения</div>
                {% endif %}
                <div class="hero-card__name">{{ hero.name }}</div>
            </a>
        {% empty %}
            <div class="empty">Пока нет ни одного героя.</div>
        {% endfor %}
    </div>
</body>
</html>
